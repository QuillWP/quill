[package]
name = "quill-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
quill-core = { path = "../crates/quill-core" }
quill-formats = { path = "../crates/quill-formats" }
quill-app = { path = "../crates/quill-app", features = ["fuzzing"] }

# The same patched winit as the main workspace (see ../vendor/README.md).
[patch.crates-io]
winit = { path = "../vendor/winit" }

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

