[workspace]
resolver = "3"
members = ["crates/quill-core", "crates/quill-layout", "crates/quill-formats", "crates/quill-app"]
exclude = ["fuzz"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://quillwp.com"
repository = "https://github.com/QuillWP/quill"
publish = false

# winit is built from a patched copy in vendor/winit. See vendor/README.md
# before upgrading or removing it.
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.dependencies]
quill-core = { path = "crates/quill-core" }
quill-layout = { path = "crates/quill-layout" }
quill-formats = { path = "crates/quill-formats" }

# Small and fast release builds: the footprint is part of the point.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
