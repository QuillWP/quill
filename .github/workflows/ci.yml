# Build, test and package Quill on all three systems, and report its
# footprint against the budget (tools/footprint.py) on every push.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev fonts-dejavu-core time

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Package
        run: python tools/package.py --dist

      - name: Packaging checks
        run: python -m unittest discover -s tools -p test_package.py

      - name: Footprint
        shell: bash
        run: python3 tools/footprint.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: quill-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
