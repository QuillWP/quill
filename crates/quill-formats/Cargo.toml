[package]
name = "quill-formats"
description = "Quill document formats: native .qwp, DOCX, RTF, ODT, HTML, Markdown and plain text"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
quill-core.workspace = true
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
quick-xml = { version = "0.42", default-features = false, features = ["escape-html"] }
# Pictures in formats Quill turns into PNG as they come in (BMP is read by
# hand): pure Rust decoders from the image-rs project.
gif = { version = "0.14", default-features = false, features = ["std"] }
tiff = { version = "0.11", default-features = false, features = ["deflate", "fax", "lzw"] }
image-webp = { version = "0.2", default-features = false }
